services:
  coldstore:
    build: .
    image: coldstore-archive:1.0.0
    container_name: coldstore-archive
    ports:
      - "3000:3000"
    environment:
      JWT_SECRET: ${JWT_SECRET:-please-change-this-secret}
    volumes:
      - coldstore-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  coldstore-data:
